<div class="modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-3xl mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">New Trade</h2>
        <p class="modal-subtitle">Back-to-back: buy from vendor, sell to purchaser.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    {% if not vendors or not customers %}
    <div class="accent-card mb-4" style="border-left-color: #ca8a04; background: #fef9c3;">
      <p class="text-sm text-yellow-900">You need at least one vendor and one customer first. <a href="/trade/parties" class="underline font-medium">Manage parties →</a></p>
    </div>
    {% endif %}

    <form hx-post="/trade/trades" hx-target="#modal-container" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="field-label field-label-required">Vendor</label>
          <select name="vendor_id" required class="w-full px-3 py-2.5">
            <option value="">— Select vendor —</option>
            {% for v in vendors %}<option value="{{ v.id }}" data-terms="{{ v.default_vendor_terms_days }}">{{ v.name }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="field-label field-label-required">Purchaser (Customer)</label>
          <select name="purchaser_id" required class="w-full px-3 py-2.5">
            <option value="">— Select customer —</option>
            {% for c in customers %}<option value="{{ c.id }}" data-terms="{{ c.default_customer_terms_days }}">{{ c.name }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="field-label field-label-required">Trade Date</label>
          <input type="date" name="trade_date" value="{{ today }}" required class="w-full px-3 py-2.5">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="field-label">Customer Terms (days)</label>
            <input type="number" min="0" name="customer_terms_days" value="30" id="customer_terms_input" required class="w-full px-3 py-2.5">
          </div>
          <div>
            <label class="field-label">Vendor Terms (days)</label>
            <input type="number" min="0" name="vendor_terms_days" value="7" id="vendor_terms_input" required class="w-full px-3 py-2.5">
          </div>
        </div>
      </div>

      <div class="border-t border-gray-200 pt-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-bold text-gray-900">Line Items</h3>
          <button type="button" class="text-indigo-600 hover:text-indigo-900 text-sm font-medium" onclick="addTradeLine()">+ Add line</button>
        </div>
        <div id="trade-lines"></div>
      </div>

      <div>
        <label class="field-label">Notes</label>
        <textarea name="notes" rows="2" class="w-full px-3 py-2.5" placeholder="Optional"></textarea>
      </div>

      <div id="trade-form-error" class="hidden accent-card" style="border-left-color: #dc2626; background: #fef2f2;">
        <p class="text-sm font-medium" style="color: #991b1b;">
          <span id="trade-form-error-msg">Something went wrong.</span>
        </p>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" id="trade-submit-btn" class="btn-primary">Create Trade</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    const form = document.querySelector('#modal-container form[hx-post="/trade/trades"]');
    if (!form) return;
    const errBox = document.getElementById('trade-form-error');
    const errMsg = document.getElementById('trade-form-error-msg');
    function showErr(msg) {
      errMsg.textContent = msg;
      errBox.classList.remove('hidden');
      errBox.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }
    function clearErr() { errBox.classList.add('hidden'); }

    // Client-side validation: if the browser would silently reject, tell the user WHY.
    form.addEventListener('submit', function (e) {
      clearErr();
      // Native validity check
      const missing = [];
      form.querySelectorAll('[required]').forEach(el => {
        if (!el.value || !el.value.toString().trim()) {
          const label = el.closest('div')?.querySelector('label')?.innerText?.replace('*','').trim()
                        || el.getAttribute('name');
          missing.push(label);
        }
      });
      // Every line must have a name + qty > 0
      const lines = form.querySelectorAll('#trade-lines > div');
      if (lines.length === 0) missing.push('at least one Line Item');
      lines.forEach((ln, idx) => {
        const nm = ln.querySelector('input[name$="_item_name"]')?.value?.trim();
        const q = parseFloat(ln.querySelector('input[name$="_quantity"]')?.value || '0');
        if (!nm) missing.push(`Line ${idx+1}: Item Name`);
        if (!(q > 0)) missing.push(`Line ${idx+1}: Qty must be > 0`);
      });
      if (missing.length) {
        e.preventDefault();
        e.stopPropagation();
        showErr('Please fix: ' + Array.from(new Set(missing)).join('  ·  '));
      }
    }, true);

    // Server-side error: show the message inline instead of leaving the button dead.
    form.addEventListener('htmx:responseError', function (evt) {
      let msg = 'Server error';
      try {
        const parsed = JSON.parse(evt.detail.xhr.responseText);
        msg = parsed.detail || parsed.message || msg;
      } catch (_) {
        msg = evt.detail.xhr.responseText?.slice(0, 200) || msg;
      }
      showErr(`Server said: ${msg} (HTTP ${evt.detail.xhr.status})`);
    });

    // Any HTMX request failure that isn't a response (network dropped, etc.)
    form.addEventListener('htmx:sendError', function () {
      showErr('Could not reach the server. Is the app still running?');
    });
  })();
</script>

<script>
  const ITEM_CATALOG = [
    {% for item in items %}
    { id: {{ item.id }}, name: {{ item.name|tojson }}, unit: {{ item.unit|tojson }},
      default_cost: "{{ item.default_cost }}", default_price: "{{ item.default_price }}",
      spec_labels: [{% for f in item.spec_fields %}{{ f.label|tojson }}{% if not loop.last %},{% endif %}{% endfor %}]
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  let lineCounter = 0;
  function addTradeLine() {
    const idx = lineCounter++;
    const wrap = document.createElement('div');
    wrap.className = 'border border-gray-200 rounded-lg p-4 mb-3';
    wrap.style.background = '#fafaf9';
    wrap.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
        <div class="md:col-span-4">
          <label class="field-label">From Catalog</label>
          <select class="item-picker w-full px-2 py-2 text-sm">
            <option value="">— Pick item —</option>
            ${ITEM_CATALOG.map(i => `<option value="${i.id}">${i.name}</option>`).join('')}
          </select>
        </div>
        <div class="md:col-span-4">
          <label class="field-label field-label-required">Item Name</label>
          <input name="line_${idx}_item_name" required class="w-full px-2 py-2 text-sm" placeholder="e.g. Flyer">
          <input type="hidden" name="line_${idx}_item_id" value="">
        </div>
        <div class="md:col-span-2">
          <label class="field-label">Qty</label>
          <input name="line_${idx}_quantity" type="number" step="0.001" min="0" value="1" class="w-full px-2 py-2 text-sm">
        </div>
        <div class="md:col-span-2">
          <label class="field-label">Unit</label>
          <input name="line_${idx}_unit" value="pcs" class="w-full px-2 py-2 text-sm">
        </div>
        <div class="md:col-span-3">
          <label class="field-label">Unit Cost ({{ currency }})</label>
          <input name="line_${idx}_unit_cost" type="number" step="0.01" min="0" value="0" class="w-full px-2 py-2 text-sm">
        </div>
        <div class="md:col-span-3">
          <label class="field-label">Unit Price ({{ currency }})</label>
          <input name="line_${idx}_unit_price" type="number" step="0.01" min="0" value="0" class="w-full px-2 py-2 text-sm">
        </div>
        <div class="md:col-span-6">
          <label class="field-label">Line Notes</label>
          <input name="line_${idx}_notes" class="w-full px-2 py-2 text-sm">
        </div>
      </div>
      <div class="mt-3">
        <div class="flex items-center justify-between mb-1">
          <span class="field-label">Specifications</span>
          <button type="button" class="text-indigo-600 text-xs font-medium" data-action="add-spec">+ add spec</button>
        </div>
        <div class="specs-container space-y-1"></div>
      </div>
      <div class="mt-3 text-right">
        <button type="button" class="text-red-600 text-xs font-medium" data-action="remove-line">Remove line</button>
      </div>
    `;
    document.getElementById('trade-lines').appendChild(wrap);

    wrap.querySelector('[data-action=remove-line]').addEventListener('click', () => wrap.remove());
    wrap.querySelector('[data-action=add-spec]').addEventListener('click', () => addSpecRow(wrap, idx));
    wrap.querySelector('.item-picker').addEventListener('change', (e) => {
      const id = parseInt(e.target.value || '0', 10);
      const item = ITEM_CATALOG.find(i => i.id === id);
      if (!item) return;
      wrap.querySelector(`[name=line_${idx}_item_name]`).value = item.name;
      wrap.querySelector(`[name=line_${idx}_item_id]`).value = item.id;
      wrap.querySelector(`[name=line_${idx}_unit]`).value = item.unit;
      wrap.querySelector(`[name=line_${idx}_unit_cost]`).value = item.default_cost;
      wrap.querySelector(`[name=line_${idx}_unit_price]`).value = item.default_price;
      const sc = wrap.querySelector('.specs-container');
      sc.innerHTML = '';
      item.spec_labels.forEach(label => addSpecRow(wrap, idx, label, ''));
    });
    addSpecRow(wrap, idx);
    return wrap;
  }
  function addSpecRow(wrap, idx, label = '', value = '') {
    const sc = wrap.querySelector('.specs-container');
    const row = document.createElement('div');
    row.className = 'flex gap-2';
    row.innerHTML = `
      <input name="line_${idx}_spec_label" value="${label.replace(/"/g,'&quot;')}" placeholder="Label (e.g. size)" class="w-1/3 px-2 py-1.5 text-sm">
      <input name="line_${idx}_spec_value" value="${value.replace(/"/g,'&quot;')}" placeholder="Value (e.g. 12x12)" class="flex-1 px-2 py-1.5 text-sm">
      <button type="button" class="text-gray-400 hover:text-red-600 text-sm px-2">✕</button>
    `;
    row.querySelector('button').addEventListener('click', () => row.remove());
    sc.appendChild(row);
  }
  document.querySelector('select[name=vendor_id]').addEventListener('change', e => {
    const t = e.target.selectedOptions[0]?.dataset.terms;
    if (t) document.getElementById('vendor_terms_input').value = t;
  });
  document.querySelector('select[name=purchaser_id]').addEventListener('change', e => {
    const t = e.target.selectedOptions[0]?.dataset.terms;
    if (t) document.getElementById('customer_terms_input').value = t;
  });
  addTradeLine();
</script>
