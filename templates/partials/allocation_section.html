<div id="allocation-section">
{% if changes.total_change > 0 %}
<div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Recommended Allocation</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-orange-50 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">Donation (10%)</span>
                <span class="text-xs text-gray-500">10%</span>
            </div>
            <div class="text-2xl font-bold text-orange-700">
                {{ format_currency(changes.donation) }}
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
                <div class="bg-orange-500 h-2 rounded-full" style="width: 10%"></div>
            </div>
        </div>
        
        <div class="bg-blue-50 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">Personal Expense (20%)</span>
                <span class="text-xs text-gray-500">20%</span>
            </div>
            <div class="text-2xl font-bold text-blue-700">
                {{ format_currency(changes.personal_exp) }}
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
                <div class="bg-blue-500 h-2 rounded-full" style="width: 20%"></div>
            </div>
        </div>
        
        <div class="bg-green-50 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">Investment (70%)</span>
                <span class="text-xs text-gray-500">70%</span>
            </div>
            <div class="text-2xl font-bold text-green-700">
                {{ format_currency(changes.investment) }}
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
                <div class="bg-green-500 h-2 rounded-full" style="width: 70%"></div>
            </div>
        </div>
    </div>
</div>
{% endif %}
</div>
