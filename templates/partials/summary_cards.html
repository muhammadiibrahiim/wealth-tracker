<div id="summary-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <div class="stat-card">
        <div class="stat-label">Previous Networth</div>
        <div class="stat-value">
            {{ format_currency(changes.networth_prev) }}
        </div>
    </div>
    
    <div class="stat-card">
        <div class="stat-label">Current Networth</div>
        <div class="stat-value">
            {{ format_currency(changes.networth_curr) }}
        </div>
    </div>
    
    <div class="stat-card">
        <div class="stat-label">Networth Change</div>
        <div class="text-xl font-bold {{ 'wt-pos' if changes.networth_change >= 0 else 'wt-neg' }}">
            {{ format_delta(changes.networth_change) }}
        </div>
    </div>
    
    <div class="bg-yellow-50 p-4 rounded-lg border-l-4 border-yellow-500">
        <div class="stat-label">Total Change</div>
        <div class="text-xl font-bold {{ 'wt-pos' if changes.total_change >= 0 else 'wt-neg' }}">
            {{ format_delta(changes.total_change) }}
        </div>
    </div>
</div>
