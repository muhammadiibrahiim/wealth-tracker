<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center">
    <div class="wt-panel -xl p-6 w-full max-w-md mx-4">
        <h2 class="text-2xl font-bold wt-ink mb-4">Add New Asset</h2>
        
        {% if error %}
        <div class="mb-4 p-3 bg-red-100 border border-red-400 wt-neg rounded">
            {{ error }}
        </div>
        {% endif %}
        
        <form hx-post="/wealth/assets" hx-target="#asset-list">
            <div class="mb-4">
                <label for="asset_name" class="field-label">
                    Asset Name
                </label>
                <input 
                    type="text"
                    id="asset_name"
                    name="asset_name"
                    value="{{ asset_name or '' }}"
                    required class="w-full"
                    placeholder="e.g., Savings Account">
            </div>
            
            <div class="flex justify-end space-x-3">
                <button 
                    type="button"
                    onclick="document.getElementById('modal-container').innerHTML = ''">
                    Cancel
                </button>
                <button 
                    type="submit"
                    class="btn-primary">
                    Create Asset
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Close modal on successful submission
    document.body.addEventListener('htmx:afterSwap', function(event) {
        if (event.detail.target.id === 'asset-list') {
            document.getElementById('modal-container').innerHTML = '';
        }
    });
</script>
