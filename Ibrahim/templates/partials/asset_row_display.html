<tr class="hover:bg-gray-50" id="asset-row-{{ asset.asset_id }}">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-gray-900">{{ asset.asset_name }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm text-gray-600">{{ format_currency(asset.prev_value) }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm font-semibold text-gray-900">{{ format_currency(asset.curr_value) }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm font-semibold {{ 'text-green-600' if asset.change >= 0 else 'text-red-600' }}">
            {{ format_delta(asset.change) }}
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right space-x-2">
        <button 
            class="text-blue-600 hover:text-blue-800 text-sm font-medium"
            hx-get="/wealth/entries/{{ year_month }}/edit/{{ asset.asset_id }}"
            hx-target="#asset-row-{{ asset.asset_id }}"
            hx-swap="outerHTML">
            Edit
        </button>
        <button 
            class="text-red-600 hover:text-red-800 text-sm font-medium"
            hx-delete="/wealth/entries/{{ year_month }}/delete/{{ asset.asset_id }}"
            hx-target="#asset-row-{{ asset.asset_id }}"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to remove this asset entry from {{ year_month }}?">
            Delete
        </button>
    </td>
</tr>
