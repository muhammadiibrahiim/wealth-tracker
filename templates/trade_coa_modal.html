<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-md mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">{% if account %}Edit Account{% else %}New Account{% endif %}</h2>
        <p class="modal-subtitle">Add a leaf account under a subclass.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    <form hx-post="{{ action }}" class="space-y-4">
      <div>
        <label class="field-label field-label-required">Name</label>
        <input name="name" required value="{{ account.name if account else '' }}" placeholder="e.g. Rent Expense" class="w-full px-3 py-2.5">
      </div>

      {% if subclasses is not none %}
      <div>
        <label class="field-label field-label-required">Under Subclass</label>
        <select name="subclass_code" required class="w-full px-3 py-2.5">
          <option value="">— pick —</option>
          {% for s in subclasses %}<option value="{{ s.code }}">{{ s.code }} — {{ s.name }}</option>{% endfor %}
        </select>
        <p class="text-xs text-gray-500 mt-1">For Rent/Salary: 5200 Operating Expenses · For a new bank: 1100 Cash & Bank.</p>
      </div>
      {% else %}
      <div>
        <label class="field-label">Code</label>
        <input value="{{ account.code }}" readonly class="w-full px-3 py-2.5 bg-gray-50 font-mono text-sm">
      </div>
      {% endif %}

      <div>
        <label class="field-label">Description</label>
        <textarea name="description" rows="2" class="w-full px-3 py-2.5">{{ account.description or '' if account else '' }}</textarea>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
