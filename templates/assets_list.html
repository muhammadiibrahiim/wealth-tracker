{% extends"base.html" %}

{% block title %}Assets - Wealth Tracker{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="page-title">Assets</h1>
        <button 
            class="btn-primary"
            hx-get="/wealth/assets/new"
            hx-target="#modal-container">
            ➕ Add New Asset
        </button>
    </div>

    <!-- Search bar -->
    <div class="mb-6">
        <input 
            type="text"
            name="query"
            placeholder="Search assets..." class="w-full"
            hx-get="/wealth/assets"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#asset-list">
    </div>

    <!-- Assets list -->
    <div class="wt-panel overflow-hidden">
        <div id="asset-list">
            {% include"partials/asset_list_rows.html" %}
        </div>
    </div>
</div>
{% endblock %}
