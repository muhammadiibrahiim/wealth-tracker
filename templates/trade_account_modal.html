<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-md mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">{% if account %}Edit Account{% else %}New Account{% endif %}</h2>
        <p class="modal-subtitle">Cash, bank, mobile wallet, or capital account.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    <form hx-post="{{ action }}" hx-disabled-elt="find button[type=submit]" class="space-y-4">
      <div>
        <label class="field-label field-label-required">Name</label>
        <input name="name" required value="{{ account.name if account else '' }}" placeholder="e.g. Meezan Current" class="w-full">
      </div>

      <div>
        <label class="field-label">Type</label>
        <select name="kind" class="w-full">
          {% set kinds = [('bank','Bank'), ('cash','Cash'), ('mobile_wallet','Mobile Wallet'), ('capital','Capital / Equity'), ('other','Other')] %}
          {% for v, lbl in kinds %}<option value="{{ v }}" {% if account and account.kind == v %}selected{% endif %}>{{ lbl }}</option>{% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="field-label">Bank Name</label>
          <input name="bank_name" value="{{ account.bank_name or '' if account else '' }}" class="w-full">
        </div>
        <div>
          <label class="field-label">Account #</label>
          <input name="account_number" value="{{ account.account_number or '' if account else '' }}" class="w-full">
        </div>
      </div>

      <div>
        <label class="field-label">Opening Balance ({{ currency }})</label>
        <input type="number" step="0.01" name="opening_balance" value="{{ account.opening_balance if account else 0 }}" class="w-full">
      </div>

      <div>
        <label class="field-label">Notes</label>
        <textarea name="notes" rows="2" class="w-full">{{ account.notes or '' if account else '' }}</textarea>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Save Account</button>
      </div>
    </form>
  </div>
</div>
