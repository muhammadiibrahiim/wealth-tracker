<tr class="hover:bg-gray-50 bg-yellow-50" id="asset-row-{{ asset.asset_id }}">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-gray-900">{{ asset.asset_name }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm text-gray-600">{{ format_currency(asset.prev_value) }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <form id="edit-form-{{ asset.asset_id }}" class="inline-block">
            <input 
                type="number"
                name="value"
                step="0.01"
                value="{{ asset.curr_value }}"
                required
                class="w-32 px-3 py-1 text-sm border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent text-right"
                autofocus>
        </form>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm text-gray-500">—</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right space-x-2">
        <button 
            class="text-green-600 hover:text-green-800 text-sm font-medium"
            hx-post="/wealth/entries/{{ year_month }}/update/{{ asset.asset_id }}"
            hx-include="#edit-form-{{ asset.asset_id }}"
            hx-target="closest tr"
            hx-swap="outerHTML">
            Save
        </button>
        <button 
            class="text-gray-600 hover:text-gray-800 text-sm font-medium"
            hx-get="/wealth/entries/{{ year_month }}/cancel/{{ asset.asset_id }}"
            hx-target="closest tr"
            hx-swap="outerHTML">
            Cancel
        </button>
    </td>
</tr>
