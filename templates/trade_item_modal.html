<div class="modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-lg mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">{% if item %}Edit Item{% else %}New Item{% endif %}</h2>
        <p class="modal-subtitle">Reusable catalog entry with customizable spec fields.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    <form hx-post="{{ action }}" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="field-label field-label-required">Name</label>
          <input name="name" required value="{{ item.name if item else '' }}" placeholder="e.g. Flyer" class="w-full">
        </div>
        <div>
          <label class="field-label">SKU</label>
          <input name="sku" value="{{ item.sku or '' if item else '' }}" class="w-full">
        </div>
        <div>
          <label class="field-label">Unit</label>
          <input name="unit" value="{{ item.unit if item else 'pcs' }}" class="w-full">
        </div>
        <div></div>
        <div>
          <label class="field-label">Default Cost ({{ currency }})</label>
          <input type="number" step="0.01" name="default_cost" value="{{ item.default_cost if item else 0 }}" class="w-full">
        </div>
        <div>
          <label class="field-label">Default Price ({{ currency }})</label>
          <input type="number" step="0.01" name="default_price" value="{{ item.default_price if item else 0 }}" class="w-full">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="field-label">Spec Fields</label>
          <button type="button" class="wt-info text-xs font-medium hover:underline" onclick="addSpec()">+ add field</button>
        </div>
        <p class="text-xs wt-mute mb-2">These labels auto-appear on the trade form (e.g."size","sides","paper GSM").</p>
        <div id="spec-fields" class="space-y-2"></div>
      </div>

      <div>
        <label class="field-label">Notes</label>
        <textarea name="notes" rows="2" class="w-full">{{ item.notes or '' if item else '' }}</textarea>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Save Item</button>
      </div>
    </form>
  </div>
</div>

<script>
  function addSpec(val = '') {
    const row = document.createElement('div');
    row.className = 'flex gap-2';
    row.innerHTML = `
      <input name="spec_label" value="${val.replace(/"/g,'&quot;')}" placeholder="e.g. size" class="flex-1 text-sm">
      <button type="button" class="wt-ash hover:wt-neg px-2">✕</button>
    `;
    row.querySelector('button').addEventListener('click', () => row.remove());
    document.getElementById('spec-fields').appendChild(row);
  }
  {% if item and item.spec_fields %}
    {% for f in item.spec_fields %}addSpec({{ f.label|tojson }});{% endfor %}
  {% else %}
    addSpec();
  {% endif %}
</script>
