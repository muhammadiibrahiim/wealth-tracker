<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-md mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">Edit Purchase Batch</h2>
        <p class="modal-subtitle">{{ trade.reference }} · {{ line.item_name if line else '' }}</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    <form hx-post="/trade/purchases/{{ purchase.id }}/edit" hx-disabled-elt="find button[type=submit]" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label field-label-required">Quantity</label>
          <input type="number" step="0.001" min="0.001" name="quantity" value="{{ '{:g}'.format(purchase.quantity) }}" required class="w-full">
          <p class="text-xs mt-1 wt-mute">{{ line.unit if line else 'pcs' }}</p>
        </div>
        <div>
          <label class="field-label field-label-required">Rate ({{ currency }})</label>
          <input type="number" step="0.0001" min="0" name="unit_cost" value="{{ '{:g}'.format(purchase.unit_cost) }}" required class="w-full">
        </div>
      </div>
      <div>
        <label class="field-label field-label-required">Purchased On</label>
        <input type="date" name="purchased_on" value="{{ purchase.purchased_on }}" required class="w-full">
      </div>
      <div>
        <label class="field-label">Notes</label>
        <input type="text" name="notes" value="{{ purchase.notes or '' }}" placeholder="Optional" class="w-full">
      </div>

      <div class="accent-card wt-card-info wt-info-bg">
        <p class="text-sm wt-ink">💡 Saving recomputes this line's weighted-average cost and re-derives every delivery-event journal — the posted COGS updates to match the corrected rate/qty.</p>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
