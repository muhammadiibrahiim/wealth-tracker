<div class="modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-2xl mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">Edit Trade Details</h2>
        <p class="modal-subtitle">{{ trade.reference }} · dates, terms and payment splits. Doesn't change items or the ledger.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    <form hx-post="/trade/trades/{{ trade.id }}/edit" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="field-label">Trade Date</label>
          <input type="date" name="trade_date" value="{{ trade.trade_date }}" class="w-full">
        </div>
        <div>
          <label class="field-label">Customer credit days</label>
          <input type="number" min="0" name="customer_terms_days" value="{{ trade.customer_terms_days }}" class="w-full">
        </div>
        <div>
          <label class="field-label">Vendor credit days</label>
          <input type="number" min="0" name="vendor_terms_days" value="{{ trade.vendor_terms_days }}" class="w-full">
        </div>
      </div>

      <div class="border border-gray-200 rounded-lg p-3 wt-info-bg">
        <div class="text-xs wt-mute mb-2">Payment split — <b>Advance</b> on the trade date, <b>On delivery</b> when goods move, <b>Credit</b> the"credit days" above after delivery. Each row should total 100%.</div>
        <div class="grid grid-cols-12 gap-2 items-end mb-1.5">
          <div class="col-span-3 text-xs font-semibold wt-body pb-1.5">Customer pays you</div>
          <div class="col-span-3"><label class="field-label text-xs">Advance %</label><input type="number" min="0" step="1" name="cust_advance_pct" value="{{ '{:g}'.format(trade.cust_advance_pct) }}" class="w-full text-sm split-pct" data-side="cust"></div>
          <div class="col-span-3"><label class="field-label text-xs">On delivery %</label><input type="number" min="0" step="1" name="cust_delivery_pct" value="{{ '{:g}'.format(trade.cust_delivery_pct) }}" class="w-full text-sm split-pct" data-side="cust"></div>
          <div class="col-span-3"><label class="field-label text-xs">Credit %</label><input type="number" min="0" step="1" name="cust_credit_pct" value="{{ '{:g}'.format(trade.cust_credit_pct) }}" class="w-full text-sm split-pct" data-side="cust"></div>
        </div>
        <div class="grid grid-cols-12 gap-2 items-end">
          <div class="col-span-3 text-xs font-semibold wt-body pb-1.5">You pay vendor</div>
          <div class="col-span-3"><input type="number" min="0" step="1" name="vend_advance_pct" value="{{ '{:g}'.format(trade.vend_advance_pct) }}" class="w-full text-sm split-pct" data-side="vend"></div>
          <div class="col-span-3"><input type="number" min="0" step="1" name="vend_delivery_pct" value="{{ '{:g}'.format(trade.vend_delivery_pct) }}" class="w-full text-sm split-pct" data-side="vend"></div>
          <div class="col-span-3"><input type="number" min="0" step="1" name="vend_credit_pct" value="{{ '{:g}'.format(trade.vend_credit_pct) }}" class="w-full text-sm split-pct" data-side="vend"></div>
        </div>
        <div id="split-warn" class="text-xs wt-warn mt-1.5 hidden"></div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  function checkSplits(){
    const warn = document.getElementById('split-warn'); if(!warn) return;
    const sum = side => ['advance','delivery','credit'].reduce((a,f)=>{
      const el = document.querySelector(`[name=${side}_${f}_pct]`);
      return a + (parseFloat(el && el.value) || 0);
    }, 0);
    const cs = sum('cust'), vs = sum('vend'); const msgs = [];
    if (Math.abs(cs-100) > 0.01) msgs.push(`Customer = ${cs}%`);
    if (Math.abs(vs-100) > 0.01) msgs.push(`Vendor = ${vs}%`);
    if (msgs.length){ warn.textContent = '⚠ Split ' + msgs.join(' · ') + ' (should be 100% — will be normalised).'; warn.classList.remove('hidden'); }
    else warn.classList.add('hidden');
  }
  document.querySelectorAll('.split-pct').forEach(el => el.addEventListener('input', checkSplits));
})();
</script>
