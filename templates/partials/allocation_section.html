<div id="allocation-section">
{% if changes.total_change > 0 %}
<div class="wt-panel p-6">
    <h2>Recommended Allocation</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-orange-50 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium wt-body">Donation (10%)</span>
                <span class="text-xs wt-mute">10%</span>
            </div>
            <div class="text-2xl font-bold wt-neg">
                {{ format_currency(changes.donation) }}
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
                <div class="bg-orange-500 h-2 rounded-full" style="width: 10%"></div>
            </div>
        </div>
        
        <div class="bg-blue-50 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium wt-body">Personal Expense (20%)</span>
                <span class="text-xs wt-mute">20%</span>
            </div>
            <div class="text-2xl font-bold wt-info">
                {{ format_currency(changes.personal_exp) }}
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
                <div class="btn-primary" style="width: 20%"></div>
            </div>
        </div>
        
        <div class="bg-green-50 p-4 rounded-lg">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium wt-body">Investment (70%)</span>
                <span class="text-xs wt-mute">70%</span>
            </div>
            <div class="text-2xl font-bold wt-pos">
                {{ format_currency(changes.investment) }}
            </div>
            <div class="mt-2 bg-gray-200 rounded-full h-2">
                <div class="btn-primary" style="width: 70%"></div>
            </div>
        </div>
    </div>
</div>
{% endif %}
</div>
