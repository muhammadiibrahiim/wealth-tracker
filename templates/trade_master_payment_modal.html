<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-lg mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">💰 Receive Customer Payment</h2>
        <p class="modal-subtitle">One receipt, applied <b>oldest-due-first</b> across the customer's trades — each covered trade flips to Paid.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    {% if not customers %}
    <div class="accent-card" style="border-left-color:#ca8a04; background:#fef9c3;">
      <p class="text-sm text-yellow-900">No customers yet. <a href="/trade/parties" class="underline font-medium">Add a party →</a></p>
    </div>
    {% else %}
    <form hx-post="/trade/payments/receive" class="space-y-4" enctype="multipart/form-data">
      <div>
        <label class="field-label field-label-required">Customer</label>
        <select name="customer_id" id="mrp-customer" required class="w-full px-3 py-2.5"
                hx-get="/trade/payments/receive/preview" hx-target="#mrp-preview" hx-include="#mrp-amount"
                hx-trigger="change">
          <option value="">— Select customer —</option>
          {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label field-label-required">Amount received ({{ currency }})</label>
          <input type="number" step="0.01" min="0.01" name="amount" id="mrp-amount" required class="w-full px-3 py-2.5"
                 placeholder="e.g. 100000"
                 hx-get="/trade/payments/receive/preview" hx-target="#mrp-preview" hx-include="#mrp-customer"
                 hx-trigger="keyup changed delay:400ms">
        </div>
        <div>
          <label class="field-label field-label-required">Received On</label>
          <input type="date" name="received_on" value="{{ today }}" required class="w-full px-3 py-2.5">
        </div>
      </div>

      <!-- live allocation preview -->
      <div id="mrp-preview"></div>

      <div>
        <label class="field-label field-label-required">Received Into Account</label>
        <select name="account_ref" required class="w-full px-3 py-2.5">
          <option value="">— Select account —</option>
          {% if accounts %}
          <optgroup label="Cash &amp; Bank Accounts">
            {% for a in accounts %}<option value="cash:{{ a.id }}">{{ a.name }}{% if a.bank_name %} — {{ a.bank_name }}{% endif %}</option>{% endfor %}
          </optgroup>
          {% endif %}
          {% for g in gl_groups %}
          <optgroup label="{{ g.label }}">
            {% for a in g.accounts %}<option value="gl:{{ a.id }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}
          </optgroup>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Method</label>
          <select name="method" class="w-full px-3 py-2.5">
            <option value="">— Select —</option>
            <option>Cash</option><option>Bank transfer</option><option>Cheque</option>
            <option>Mobile wallet</option><option>Card</option><option>Other</option>
          </select>
        </div>
        <div>
          <label class="field-label">Reference</label>
          <input type="text" name="reference" placeholder="cheque#, txn id…" class="w-full px-3 py-2.5">
        </div>
      </div>

      <div>
        <label class="field-label">Notes</label>
        <textarea name="notes" rows="1" class="w-full px-3 py-2.5"></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Apply Payment</button>
      </div>
    </form>
    {% endif %}
  </div>
</div>
