<div class="modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-2xl mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">Edit Line Item</h2>
        <p class="modal-subtitle">{{ trade.reference }} · changing qty, cost or price re-posts this trade's ledger.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    <form hx-post="/trade/trades/{{ trade.id }}/lines/{{ line.id }}" class="space-y-4">
      <div>
        <label class="field-label field-label-required">Item Name</label>
        <input name="item_name" value="{{ line.item_name }}" required class="w-full px-3 py-2.5">
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="field-label">Qty</label>
          <input type="number" step="0.001" min="0" name="quantity" value="{{ '{:g}'.format(line.quantity) }}" class="w-full px-3 py-2.5">
        </div>
        <div>
          <label class="field-label">Unit</label>
          <input name="unit" value="{{ line.unit }}" class="w-full px-3 py-2.5">
        </div>
        <div>
          <label class="field-label">Unit Cost ({{ currency }})</label>
          <input type="number" step="0.0001" min="0" name="unit_cost" value="{{ '{:g}'.format(line.unit_cost) }}" class="w-full px-3 py-2.5">
        </div>
        <div>
          <label class="field-label">Unit Price ({{ currency }})</label>
          <input type="number" step="0.01" min="0" name="unit_price" value="{{ '{:g}'.format(line.unit_price) }}" class="w-full px-3 py-2.5">
        </div>
      </div>
      <div>
        <label class="field-label">Line Notes</label>
        <input name="line_notes" value="{{ line.line_notes or '' }}" class="w-full px-3 py-2.5">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="field-label">Specifications</span>
          <button type="button" class="text-indigo-600 text-xs font-medium" onclick="addLineSpec()">+ add spec</button>
        </div>
        <div id="line-specs" class="space-y-1"></div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const EXISTING = [{% for s in line.specs %}{label: {{ (s.label or '')|tojson }}, value: {{ (s.value or '')|tojson }}}{% if not loop.last %},{% endif %}{% endfor %}];
  window.addLineSpec = function(lab, val){
    const wrap = document.getElementById('line-specs');
    const row = document.createElement('div');
    row.className = 'grid grid-cols-12 gap-2 items-center';
    row.innerHTML = `
      <input name="spec_label" placeholder="Label (e.g. Brand)" value="${(lab||'').replace(/"/g,'&quot;')}" class="col-span-5 px-2 py-1.5 text-sm">
      <input name="spec_value" placeholder="Value (e.g. Fleuré)" value="${(val||'').replace(/"/g,'&quot;')}" class="col-span-6 px-2 py-1.5 text-sm">
      <button type="button" class="col-span-1 text-gray-400 hover:text-red-600 text-sm" onclick="this.closest('div').remove()">✕</button>`;
    wrap.appendChild(row);
  };
  EXISTING.forEach(s => addLineSpec(s.label, s.value));
  if (!EXISTING.length) addLineSpec();
})();
</script>
