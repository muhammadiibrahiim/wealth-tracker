{% if success_message %}
<div class="p-4 bg-green-100 border-l-4 border-green-500 text-green-700">
    {{ success_message }}
</div>
{% endif %}

{% if assets %}
<table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
        <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Asset Name
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Created
            </th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                Actions
            </th>
        </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
        {% for asset in assets %}
        <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm font-medium text-gray-900">{{ asset.name }}</div>
                <div class="text-sm text-gray-500">{{ asset.slug }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
                <div class="text-sm text-gray-900">{{ asset.created_at.strftime('%Y-%m-%d') }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                <button 
                    class="text-blue-600 hover:text-blue-900"
                    hx-get="/wealth/assets/{{ asset.id }}/edit"
                    hx-target="#modal-container">
                    Edit
                </button>
                <button 
                    class="text-red-600 hover:text-red-900"
                    hx-post="/wealth/assets/{{ asset.id }}/delete"
                    hx-target="#asset-list"
                    hx-confirm="Are you sure you want to delete this asset? This will also delete all associated valuations.">
                    Delete
                </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="p-8 text-center text-gray-500">
    <p class="text-lg mb-2">No assets found</p>
    <p class="text-sm">Create your first asset to get started</p>
</div>
{% endif %}
