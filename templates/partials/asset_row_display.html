<tr class="hover:wt-surface-soft" id="asset-row-{{ asset.asset_id }}">
    <td>
        <div class="text-sm font-medium wt-ink">{{ asset.asset_name }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm wt-mute">{{ format_currency(asset.prev_value) }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm font-semibold wt-ink">{{ format_currency(asset.curr_value) }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right">
        <div class="text-sm font-semibold {{ 'wt-pos' if asset.change >= 0 else 'wt-neg' }}">
            {{ format_delta(asset.change) }}
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right space-x-2">
        <button 
            class="wt-info hover:wt-info text-sm font-medium"
            hx-get="/wealth/entries/{{ year_month }}/edit/{{ asset.asset_id }}"
            hx-target="#asset-row-{{ asset.asset_id }}"
            hx-swap="outerHTML">
            Edit
        </button>
        <button 
            class="wt-neg hover:wt-neg text-sm font-medium"
            hx-delete="/wealth/entries/{{ year_month }}/delete/{{ asset.asset_id }}"
            hx-target="#asset-row-{{ asset.asset_id }}"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to remove this asset entry from {{ year_month }}?">
            Delete
        </button>
    </td>
</tr>
