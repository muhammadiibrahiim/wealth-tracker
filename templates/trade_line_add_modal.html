<div class="modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-2xl mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">Add Line Item</h2>
        <p class="modal-subtitle">{{ trade.reference }} · pick an item (or type a new one) — it re-posts the trade's ledger. Leave Unit Cost 0 to fill the buy rate later via Record Purchase.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    <form hx-post="/trade/trades/{{ trade.id }}/lines" class="space-y-4">
      <div>
        <label class="field-label field-label-required">Item</label>
        <div style="position:relative;">
          <input name="item_name" id="al-item-input" autocomplete="off" required class="w-full" placeholder="Type or pick an item…" style="padding-right:30px;">
          <span id="al-item-caret" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; color:#6b7280; font-size:11px; padding:5px; user-select:none;">▼</span>
          <div id="al-item-dd" style="display:none; position:absolute; z-index:60; left:0; right:0; top:100%; margin-top:2px; background:#fff; border:1px solid #e5e7eb; border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.12); max-height:220px; overflow:auto;"></div>
        </div>
        <input type="hidden" name="item_id" id="al-item-id" value="">
        <div class="text-xs wt-ash mt-1">Pick an existing item to prefill unit, price &amp; specs — or type a new name.</div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="field-label field-label-required">Qty</label>
          <input type="number" step="0.001" min="0" name="quantity" value="1" required class="w-full">
        </div>
        <div>
          <label class="field-label">Unit</label>
          <input name="unit" value="pcs" class="w-full">
        </div>
        <div>
          <label class="field-label">Unit Cost ({{ currency }})</label>
          <input type="number" step="0.0001" min="0" name="unit_cost" placeholder="0 = pending" class="w-full">
        </div>
        <div>
          <label class="field-label">Unit Price ({{ currency }})</label>
          <input type="number" step="0.01" min="0" name="unit_price" value="0" class="w-full">
        </div>
      </div>
      <div>
        <label class="field-label">Line Notes</label>
        <input name="line_notes" class="w-full">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <span class="field-label">Specifications</span>
          <button type="button" class="wt-info text-xs font-medium" onclick="alAddSpec()">+ add spec</button>
        </div>
        <div id="line-specs" class="space-y-1"></div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Add Line</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const CATALOG = [
    {% for item in items %}
    { id: {{ item.id }}, name: {{ item.name|tojson }}, unit: {{ item.unit|tojson }},
      default_cost:"{{ item.default_cost }}", default_price:"{{ item.default_price }}",
      spec_labels: [{% for f in item.spec_fields %}{{ f.label|tojson }}{% if not loop.last %},{% endif %}{% endfor %}] }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];
  const SPEC_VALUES = {{ spec_values|tojson }};
  const OPT_STYLE = 'padding:9px 12px;font-size:13px;cursor:pointer;';
  function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const specsWrap = document.getElementById('line-specs');
  window.alAddSpec = function(label, value){
    const row = document.createElement('div');
    row.className = 'grid grid-cols-12 gap-2 items-center';
    row.innerHTML = `
      <input name="spec_label" placeholder="Label (e.g. Brand)" value="${esc(label||'')}" class="al-spec-label col-span-5 text-sm">
      <input name="spec_value" placeholder="Value" value="${esc(value||'')}" list="" class="al-spec-value col-span-6 text-sm">
      <button type="button" class="col-span-1 wt-ash hover:wt-neg text-sm" onclick="this.closest('div').remove()">✕</button>`;
    specsWrap.appendChild(row);
    // simple value autocomplete via datalist keyed on the label
    const lab = row.querySelector('.al-spec-label'), valEl = row.querySelector('.al-spec-value');
    function sync(){
      const key = (lab.value||'').trim().toLowerCase();
      const vals = SPEC_VALUES[key] || [];
      let dl = row.querySelector('datalist');
      if (!dl){ dl = document.createElement('datalist'); dl.id = 'dl'+Math.random().toString(36).slice(2); row.appendChild(dl); valEl.setAttribute('list', dl.id); }
      dl.innerHTML = vals.map(v=>`<option value="${esc(v)}">`).join('');
    }
    lab.addEventListener('input', sync); sync();
  };

  // ── Item combo ──
  const input = document.getElementById('al-item-input');
  const dd = document.getElementById('al-item-dd');
  const caret = document.getElementById('al-item-caret');
  const hid = document.getElementById('al-item-id');
  let opts = [], active = -1;
  function prefill(it){
    document.querySelector('[name=unit]').value = it.unit || 'pcs';
    if (it.default_cost) document.querySelector('[name=unit_cost]').value = it.default_cost;
    if (it.default_price) document.querySelector('[name=unit_price]').value = it.default_price;
    specsWrap.innerHTML = '';
    (it.spec_labels||[]).forEach(l => alAddSpec(l, ''));
    if (!(it.spec_labels||[]).length) alAddSpec();
  }
  function choose(el){
    if (el.dataset.new){ hid.value=''; }
    else { const it = CATALOG.find(x=>String(x.id)===el.dataset.id); if(it){ input.value=it.name; hid.value=it.id; prefill(it); } }
    dd.style.display='none'; active=-1;
  }
  function highlight(i){ opts.forEach((o,j)=>o.style.background=j===i?'#eef2ff':''); if(opts[i])opts[i].scrollIntoView({block:'nearest'}); active=i; }
  function render(){
    const q = input.value.trim().toLowerCase();
    const matches = CATALOG.filter(it=>it.name.toLowerCase().includes(q));
    let html = matches.map(it=>`<div class="al-opt" style="${OPT_STYLE}" data-id="${it.id}">${esc(it.name)}</div>`).join('');
    const exact = CATALOG.some(it=>it.name.toLowerCase()===q);
    if (q && !exact) html += `<div class="al-opt" style="${OPT_STYLE}color:#b45309;font-weight:500;border-top:1px solid #f0f0f0;" data-new="1">➕ Create"${esc(input.value.trim())}"</div>`;
    if (!html) html = `<div style="padding:9px 12px;font-size:13px;color:#9ca3af;">No items yet — type a name to create one.</div>`;
    dd.innerHTML = html;
    opts = Array.from(dd.querySelectorAll('.al-opt')); active=-1;
    opts.forEach((el,i)=>{ el.addEventListener('mouseenter',()=>highlight(i)); el.addEventListener('mousedown',e=>{e.preventDefault();choose(el);}); });
  }
  function open(){ render(); dd.style.display='block'; }
  input.addEventListener('focus', open);
  input.addEventListener('input', ()=>{ hid.value=''; open(); });
  input.addEventListener('blur', ()=>setTimeout(()=>{ dd.style.display='none'; }, 160));
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); if(dd.style.display!=='block')open(); highlight(Math.min(active+1,opts.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); highlight(Math.max(active-1,0)); }
    else if(e.key==='Enter'){ if(dd.style.display==='block'&&active>=0&&opts[active]){ e.preventDefault(); choose(opts[active]); } }
    else if(e.key==='Escape'){ dd.style.display='none'; }
  });
  caret.addEventListener('mousedown', e=>{ e.preventDefault(); if(dd.style.display==='block')dd.style.display='none'; else { input.focus(); open(); } });

  alAddSpec();
})();
</script>
