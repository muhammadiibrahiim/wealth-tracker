{% if success_message %}
<div class="p-4 bg-green-100 border-l-4 border-green-500 wt-pos">
    {{ success_message }}
</div>
{% endif %}

{% if assets %}
<div class="wt-table-scroll"><table class="wt-table wt-table--dense">
    <thead class="wt-surface-soft">
        <tr>
            <th scope="col" >
                Asset Name
            </th>
            <th scope="col" >
                Created
            </th>
            <th class="num">
                Actions
            </th>
        </tr>
    </thead>
    <tbody class="bg-white">
        {% for asset in assets %}
        <tr class="hover:wt-surface-soft">
            <td>
                <div class="text-sm font-medium wt-ink">{{ asset.name }}</div>
                <div class="text-sm wt-mute">{{ asset.slug }}</div>
            </td>
            <td>
                <div class="text-sm wt-ink">{{ asset.created_at.strftime('%Y-%m-%d') }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                <button 
                    class="wt-info hover:text-blue-900"
                    hx-get="/wealth/assets/{{ asset.id }}/edit"
                    hx-target="#modal-container">
                    Edit
                </button>
                <button 
                    class="wt-neg hover:text-red-900"
                    hx-post="/wealth/assets/{{ asset.id }}/delete"
                    hx-target="#asset-list"
                    hx-confirm="Are you sure you want to delete this asset? This will also delete all associated valuations.">
                    Delete
                </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table></div>
{% else %}
<div class="p-8 text-center wt-mute">
    <p class="text-lg mb-2">No assets found</p>
    <p class="text-sm">Create your first asset to get started</p>
</div>
{% endif %}
