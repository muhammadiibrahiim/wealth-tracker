<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-lg mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">💰 Receive Customer Payment</h2>
        <p class="modal-subtitle">One receipt, applied <b>oldest-due-first</b> across the customer's trades — each covered trade flips to Paid.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    {% if not customers %}
    <div class="accent-card wt-card-warn wt-warn-bg">
      <p class="text-sm text-yellow-900">No customers yet. <a href="/trade/parties" class="underline font-medium">Add a party →</a></p>
    </div>
    {% else %}
    <form hx-post="/trade/payments/receive" class="space-y-4" enctype="multipart/form-data">
      <div>
        <label class="field-label field-label-required">Customer</label>
        <select name="customer_id" id="mrp-customer" required class="w-full"
                hx-get="/trade/payments/receive/preview" hx-target="#mrp-preview" hx-include="#mrp-amount"
                hx-trigger="change">
          <option value="">— Select customer —</option>
          {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label field-label-required">Amount received ({{ currency }})</label>
          <input type="number" step="0.01" min="0.01" name="amount" id="mrp-amount" required class="w-full"
                 placeholder="e.g. 100000"
                 hx-get="/trade/payments/receive/preview" hx-target="#mrp-preview" hx-include="#mrp-customer"
                 hx-trigger="keyup changed delay:400ms">
        </div>
        <div>
          <label class="field-label field-label-required">Received On</label>
          <input type="date" name="received_on" value="{{ today }}" required class="w-full">
        </div>
      </div>

      <!-- live allocation preview -->
      <div id="mrp-preview"></div>

      <div>
        <label class="field-label field-label-required">Received Into Account</label>
        <select name="account_ref" required class="w-full">
          <option value="">— Select account —</option>
          {% if accounts %}
          <optgroup label="Cash &amp; Bank Accounts">
            {% for a in accounts %}<option value="cash:{{ a.id }}">{{ a.name }}{% if a.bank_name %} — {{ a.bank_name }}{% endif %}</option>{% endfor %}
          </optgroup>
          {% endif %}
          {% for g in gl_groups %}
          <optgroup label="{{ g.label }}">
            {% for a in g.accounts %}<option value="gl:{{ a.id }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}
          </optgroup>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label">Method</label>
          <select name="method" class="w-full">
            <option value="">— Select —</option>
            <option>Cash</option><option>Bank transfer</option><option>Cheque</option>
            <option>Mobile wallet</option><option>Card</option><option>Other</option>
          </select>
        </div>
        <div>
          <label class="field-label">Reference</label>
          <input type="text" name="reference" placeholder="cheque#, txn id…" class="w-full">
        </div>
      </div>

      <div>
        <label class="field-label">Notes</label>
        <textarea name="notes" rows="1" class="w-full"></textarea>
      </div>

      <div>
        <label class="field-label">Payment Screenshot / Proof</label>
        <div id="mrp-proof-drop" tabindex="0"
             style="border:2px dashed #bfc1b7; border-radius:8px; padding:14px; text-align:center; cursor:pointer; background:#ffffff; outline:none;">
          <div id="mrp-proof-empty" class="text-sm wt-mute select-none">
            📎 Click to choose, drag in, or <b>paste a screenshot</b> (⌘V / Ctrl-V)
          </div>
          <img id="mrp-proof-preview" alt="proof preview" style="display:none; max-height:170px; margin:4px auto 0; border-radius:6px; border:1px solid #bfc1b7;">
          <div id="mrp-proof-name" class="text-xs wt-ash mt-1"></div>
        </div>
        <input type="file" name="proof" id="mrp-proof-input" accept="image/*" hidden>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Apply Payment</button>
      </div>
    </form>
    {% endif %}
  </div>
</div>

<script>
(function(){
  var drop=document.getElementById('mrp-proof-drop');
  var input=document.getElementById('mrp-proof-input');
  if(!drop||!input) return;
  var empty=document.getElementById('mrp-proof-empty');
  var preview=document.getElementById('mrp-proof-preview');
  var nameEl=document.getElementById('mrp-proof-name');
  function render(file){
    if(!file) return;
    try{ preview.src=URL.createObjectURL(file); }catch(e){}
    preview.style.display='block'; empty.style.display='none';
    nameEl.textContent=(file.name||'screenshot')+' · '+Math.max(1,Math.round((file.size||0)/1024))+' KB — click to replace';
  }
  function setFile(file){
    try{ var dt=new DataTransfer(); dt.items.add(file); input.files=dt.files; }catch(e){}
    render(file);
  }
  drop.addEventListener('click', function(){ input.click(); });
  input.addEventListener('change', function(){ if(input.files&&input.files[0]) render(input.files[0]); });
  drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.style.background='#e3edff'; });
  drop.addEventListener('dragleave', function(){ drop.style.background='#ffffff'; });
  drop.addEventListener('drop', function(e){ e.preventDefault(); drop.style.background='#ffffff';
    if(e.dataTransfer.files&&e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
  // Paste a screenshot anywhere while this modal is open. Self-cleans when the
  // modal is removed so listeners don't pile up across opens.
  function onPaste(e){
    if(!document.body.contains(drop)){ document.removeEventListener('paste', onPaste); return; }
    var items=(e.clipboardData&&e.clipboardData.items)||[];
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image')===0){
        var blob=items[i].getAsFile();
        var ext=((blob.type.split('/')[1])||'png').replace('jpeg','jpg');
        var file=new File([blob], 'payment-'+Date.now()+'.'+ext, {type:blob.type});
        setFile(file); e.preventDefault(); break;
      }
    }
  }
  document.addEventListener('paste', onPaste);
})();
</script>
