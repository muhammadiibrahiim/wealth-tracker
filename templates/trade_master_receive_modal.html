<div class="modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto py-6">
  <div class="bg-white p-6 w-full max-w-5xl mx-4">
    <div class="flex items-start justify-between mb-1">
      <h2 class="modal-title">Receive Goods — Master Voucher</h2>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>
    <p class="modal-subtitle mb-4">One vendor delivery across any trades &amp; items. Add a row per invoice line (same item at two rates = two rows). One bilty total is split across trades by weight.</p>

    <form hx-post="/trade/trades/receive" hx-encoding="multipart/form-data" hx-target="#modal-container" hx-swap="innerHTML" class="space-y-4">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div>
          <label class="field-label">Received on</label>
          <input type="date" name="received_on" value="{{ today.isoformat() }}" class="w-full px-3 py-2.5">
        </div>
        <div>
          <label class="field-label">Bilty total ({{ currency }})</label>
          <input type="number" name="bilty_total" step="0.01" min="0" placeholder="0.00" class="w-full px-3 py-2.5 text-right" oninput="renderSplit()">
        </div>
        <div id="recv-paidfrom-wrap">
          <label class="field-label">Bilty paid from</label>
          <select name="paid_from_id" class="w-full px-3 py-2.5">
            {% for a in cash_accounts %}<option value="{{ a.id }}" {% if a.id == default_cash_id %}selected{% endif %}>{{ a.code }} — {{ a.name }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="field-label">Terminal (optional)</label>
          <input name="terminal" list="recv-terminals" placeholder="Freight terminal" class="w-full px-3 py-2.5">
          <datalist id="recv-terminals">{% for t in terminals %}<option value="{{ t.name }}">{% endfor %}</datalist>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="md:col-span-2">
          <label class="field-label">Vendor invoice (image / PDF) — one for the whole delivery</label>
          <input type="file" name="invoice" accept="image/*,application/pdf" class="w-full text-sm">
        </div>
        <div>
          <label class="field-label">Notes (optional)</label>
          <input name="notes" placeholder="e.g. challan #1134" class="w-full px-3 py-2.5">
        </div>
      </div>

      <label class="flex items-center gap-2 text-sm text-gray-700" style="cursor:pointer;">
        <input type="checkbox" name="bilty_by_customer" value="on" onchange="document.getElementById('recv-paidfrom-wrap').style.opacity=this.checked?'0.4':'1';">
        Bilty was <b>paid by the customer</b> on our behalf — charge it to their account (reduces their receivable), not cash.
      </label>

      <div style="overflow:visible;">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-left" style="color:#6b7280; font-size:11px; text-transform:uppercase;">
              <th class="py-1 pr-2">Trade</th>
              <th class="py-1 pr-2">Item</th>
              <th class="py-1 pr-2 text-right">Qty received</th>
              <th class="py-1 pr-2 text-right">Buy rate</th>
              <th class="py-1 pr-2 text-right">Weight (kg)</th>
              <th class="py-1"></th>
            </tr>
          </thead>
          <tbody id="recv-rows"></tbody>
        </table>
      </div>
      <button type="button" class="text-indigo-600 hover:text-indigo-900 text-sm font-medium" onclick="addRecvRow()">+ Add line</button>

      <div id="recv-split" class="text-xs text-gray-500"></div>

      <div class="flex justify-end gap-2 pt-3 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Save Receipt</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const TRADES = {{ trades_data|tojson }};
  const byId = {}; TRADES.forEach(t => byId[t.id] = t);
  let idx = 0;

  window.addRecvRow = function(){
    const i = idx++;
    const tr = document.createElement('tr');
    tr.className = 'border-t border-gray-100';
    tr.innerHTML = `
      <td class="py-1 pr-2">
        <button type="button" data-trade-btn="1" data-row="${i}" onclick="openTradePicker(${i})"
                class="px-2 py-1.5 text-sm text-left" style="min-width:210px; width:100%; border:1px solid #d1d5db; border-radius:6px; background:#fff; color:#9ca3af;">— pick trade —</button>
        <input type="hidden" name="row_${i}_trade_id" value=""></td>
      <td class="py-1 pr-2"><select name="row_${i}_line_id" data-no-search onchange="recvFillRate(${i})" class="px-2 py-1.5 text-sm" style="min-width:200px;"><option value="">— item —</option></select>
          <div id="recv_hint_${i}" class="text-xs text-gray-400 mt-0.5"></div></td>
      <td class="py-1 pr-2"><input name="row_${i}_qty" type="number" step="1" min="0" oninput="recvCheck(${i})" class="px-2 py-1.5 text-sm text-right" style="width:110px;"></td>
      <td class="py-1 pr-2"><input name="row_${i}_rate" type="number" step="0.01" min="0" class="px-2 py-1.5 text-sm text-right" style="width:90px;"></td>
      <td class="py-1 pr-2"><input name="row_${i}_kg" type="number" step="0.001" min="0" oninput="renderSplit()" class="px-2 py-1.5 text-sm text-right" style="width:90px;"></td>
      <td class="py-1 text-right"><button type="button" class="text-gray-400 hover:text-red-600 text-xs" onclick="this.closest('tr').remove(); renderSplit();">✕</button></td>`;
    document.getElementById('recv-rows').appendChild(tr);
    if (window.htmx) htmx.process(tr);
  };

  window.recvFillLines = function(i){
    const tSel = document.querySelector(`[name=row_${i}_trade_id]`);
    const lSel = document.querySelector(`[name=row_${i}_line_id]`);
    const t = byId[tSel.value];
    lSel.innerHTML = '<option value="">— item —</option>' +
      (t ? t.lines.map(l => `<option value="${l.id}" data-rate="${l.rate}" data-ord="${l.ordered}" data-rec="${l.received}">${l.name}</option>`).join('') : '');
    document.getElementById(`recv_hint_${i}`).textContent = '';
  };

  window.recvFillRate = function(i){
    const lSel = document.querySelector(`[name=row_${i}_line_id]`);
    const opt = lSel.selectedOptions[0];
    if (!opt || !opt.value) { document.getElementById(`recv_hint_${i}`).textContent=''; return; }
    const rate = document.querySelector(`[name=row_${i}_rate]`);
    if (rate && !rate.value && parseFloat(opt.dataset.rate)>0) rate.value = opt.dataset.rate;
    recvCheck(i);
  };

  window.recvCheck = function(i){
    const lSel = document.querySelector(`[name=row_${i}_line_id]`);
    const opt = lSel.selectedOptions[0];
    const hint = document.getElementById(`recv_hint_${i}`);
    if (!opt || !opt.value){ hint.textContent=''; return; }
    const ord = parseFloat(opt.dataset.ord)||0, rec = parseFloat(opt.dataset.rec)||0;
    const remaining = ord - rec;
    const q = parseFloat((document.querySelector(`[name=row_${i}_qty]`)||{}).value)||0;
    let msg = `ordered ${ord.toLocaleString()} · already received ${rec.toLocaleString()} · remaining ${remaining.toLocaleString()}`;
    if (q > remaining && remaining >= 0) msg += `  ⚠ over by ${(q-remaining).toLocaleString()}`;
    hint.textContent = msg;
    hint.style.color = (q > remaining && remaining >= 0) ? '#c2410c' : '#9ca3af';
  };

  window.renderSplit = function(){
    const bilty = parseFloat((document.querySelector('[name=bilty_total]')||{}).value)||0;
    const rows = [...document.querySelectorAll('#recv-rows tr')];
    let totKg = 0; const per = [];
    rows.forEach(tr => {
      const kg = parseFloat((tr.querySelector('[name$="_kg"]')||{}).value)||0;
      const tSel = tr.querySelector('[name$="_trade_id"]');
      const t = byId[tSel && tSel.value]; totKg += kg;
      if (t && kg>0) per.push([t.ref, kg]);
    });
    const el = document.getElementById('recv-split');
    if (!bilty || totKg<=0){ el.textContent=''; return; }
    const agg = {}; per.forEach(([ref,kg]) => agg[ref]=(agg[ref]||0)+kg);
    const parts = Object.entries(agg).map(([ref,kg]) => `${ref}: {{ currency }} ${(bilty*kg/totKg).toFixed(0)}`);
    el.innerHTML = `Bilty {{ currency }} ${bilty.toLocaleString()} split by ${totKg.toLocaleString()} kg → ` + parts.join(' · ');
  };

  // ── Rich trade picker: a modal listing not-yet-complete trades with their
  //    items + ordered/received/remaining, so you pick against the right one. ──
  let pickerRow = null;
  let pickActive = -1;
  function pickRows(){ return Array.from(document.querySelectorAll('#recv-picker-body .recv-pick-row')); }
  function highlightPick(idx){
    const rows = pickRows();
    if (!rows.length) { pickActive = -1; return; }
    idx = Math.max(0, Math.min(idx, rows.length - 1));
    rows.forEach((r, i) => {
      r.style.outline = (i === idx) ? '2px solid #4338ca' : '';
      r.style.outlineOffset = '-2px';
    });
    rows[idx].scrollIntoView({ block: 'nearest' });
    pickActive = idx;
  }
  function buildPicker(){
    const old = document.getElementById('recv-trade-picker'); if (old) old.remove();
    const el = document.createElement('div');
    el.id = 'recv-trade-picker';
    el.style.cssText = 'position:fixed; inset:0; z-index:1200; display:none; background:rgba(35,37,29,0.55); padding:5vh 1rem; overflow-y:auto;';
    el.innerHTML =
      '<div style="max-width:780px; margin:0 auto; background:#fff; border-radius:10px; box-shadow:0 24px 60px rgba(0,0,0,.35);">' +
        '<div style="padding:14px 20px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:12px;">' +
          '<b style="font-size:16px;">Pick a trade to receive against</b>' +
          '<input id="recv-picker-search" placeholder="Search trade / party / item…" style="flex:1; padding:8px 10px; border:1px solid #d1d5db; border-radius:6px;">' +
          '<button type="button" id="recv-picker-close" style="font-size:20px; color:#888; line-height:1;">✕</button>' +
        '</div>' +
        '<div id="recv-picker-body" style="max-height:66vh; overflow-y:auto; padding:12px 16px;"></div>' +
      '</div>';
    document.body.appendChild(el);
    el.addEventListener('click', e => { if (e.target === el) closeTradePicker(); });
    el.querySelector('#recv-picker-close').addEventListener('click', closeTradePicker);
    el.querySelector('#recv-picker-search').addEventListener('input', function(){ renderPicker(this.value); });
    el.querySelector('#recv-picker-search').addEventListener('keydown', function(e){
      if (e.key === 'Escape'){ closeTradePicker(); return; }
      if (e.key === 'ArrowDown'){ e.preventDefault(); highlightPick(pickActive + 1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); highlightPick(pickActive - 1); }
      else if (e.key === 'Enter'){
        const rows = pickRows();
        if (pickActive >= 0 && rows[pickActive]){ e.preventDefault(); rows[pickActive].click(); }
      }
    });
    return el;
  }
  function renderPicker(q){
    q = (q||'').trim().toLowerCase();
    const body = document.getElementById('recv-picker-body');
    const open = TRADES.filter(t => t.lines.some(l => l.remaining > 0.0005) || t.pending);
    const match = open.filter(t => !q || (t.ref+' '+t.vendor+' '+t.customer+' '+t.lines.map(l=>l.name).join(' ')).toLowerCase().includes(q));
    pickActive = -1;
    if (!match.length){ body.innerHTML = '<div style="padding:28px; text-align:center; color:#9ca3af;">No matching open trades.</div>'; return; }
    body.innerHTML = match.map(t => {
      const rows = t.lines.map(l => {
        const done = l.remaining <= 0.0005;
        return `<tr class="recv-pick-row" onclick="pickTradeItem(${pickerRow}, ${t.id}, ${l.id})" style="cursor:pointer;${done?' opacity:.45;':''}" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background=''">`
          + `<td style="padding:6px 8px;">${l.name}${l.spec?`<div style="font-size:11px;color:#9ca3af;">${l.spec}</div>`:''}</td>`
          + `<td style="padding:6px 8px; text-align:right; color:#6b7280;">${l.ordered.toLocaleString()}</td>`
          + `<td style="padding:6px 8px; text-align:right; color:#6b7280;">${l.received.toLocaleString()}</td>`
          + `<td style="padding:6px 8px; text-align:right; font-weight:700; color:${done?'#9ca3af':'#c2410c'};">${l.remaining.toLocaleString()}</td></tr>`;
      }).join('');
      return `<div style="border:1px solid #e5e7eb; border-radius:8px; margin-bottom:12px; overflow:hidden;">`
        + `<div class="recv-pick-row" onclick="pickTrade(${pickerRow}, ${t.id})" style="cursor:pointer; padding:10px 12px; background:#f8fafc; display:flex; justify-content:space-between; align-items:center;" onmouseover="this.style.background='#eef2ff'" onmouseout="this.style.background='#f8fafc'">`
          + `<div><b>${t.ref}</b> <span style="color:#6b7280;">${t.vendor} → ${t.customer}</span> <span style="color:#9ca3af; font-size:11px;">${t.date}</span></div>`
          + `<span style="font-size:11px; color:#4338ca;">tap an item to pick →</span></div>`
        + `<table style="width:100%; font-size:13px; border-collapse:collapse;">`
          + `<thead><tr style="color:#9ca3af; font-size:10px; text-transform:uppercase;"><th style="text-align:left; padding:4px 8px;">Item</th><th style="text-align:right; padding:4px 8px;">Ordered</th><th style="text-align:right; padding:4px 8px;">Received</th><th style="text-align:right; padding:4px 8px;">Remaining</th></tr></thead>`
          + `<tbody>${rows}</tbody></table></div>`;
    }).join('');
  }
  function setTradeOnRow(i, tradeId){
    const hid = document.querySelector(`[name=row_${i}_trade_id]`); if (hid) hid.value = tradeId;
    const btn = document.querySelector(`[data-trade-btn][data-row="${i}"]`);
    const t = byId[tradeId];
    if (btn && t){ btn.textContent = `${t.ref} · ${t.customer}`; btn.style.color = '#111827'; }
    recvFillLines(i);
  }
  window.openTradePicker = function(i){
    pickerRow = i; buildPicker();
    const el = document.getElementById('recv-trade-picker'); el.style.display = 'block';
    const s = document.getElementById('recv-picker-search'); s.value=''; renderPicker('');
    setTimeout(()=>s.focus(), 30);
  };
  window.closeTradePicker = function(){ const el = document.getElementById('recv-trade-picker'); if (el) el.style.display='none'; };
  window.pickTrade = function(i, tradeId){
    setTradeOnRow(i, tradeId); closeTradePicker();
    const item = document.querySelector(`[name=row_${i}_line_id]`); if (item) item.focus();
  };
  window.pickTradeItem = function(i, tradeId, lineId){
    setTradeOnRow(i, tradeId);
    const item = document.querySelector(`[name=row_${i}_line_id]`); if (item) item.value = lineId;
    recvFillRate(i); closeTradePicker();
    const qty = document.querySelector(`[name=row_${i}_qty]`); if (qty) qty.focus();
  };

  // ── Keyboard flow: Enter advances field-by-field within a row; Enter on the
  //    last field (Weight) adds a new line — unless the row is entirely empty,
  //    in which case it submits the voucher. ──
  const FIELDS = ['trade_id', 'line_id', 'qty', 'rate', 'kg'];
  function rowEmpty(tr){
    return FIELDS.every(f => {
      const el = tr.querySelector(`[name$="_${f}"]`);
      return !el || !String(el.value || '').trim();
    });
  }
  document.getElementById('recv-rows').addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    if (e.target.dataset && e.target.dataset.tradeBtn){
      e.preventDefault(); openTradePicker(parseInt(e.target.dataset.row)); return;
    }
    const m = (e.target.name || '').match(/^row_\d+_(\w+)$/);
    if (!m) return;
    e.preventDefault();
    const tr = e.target.closest('tr');
    const field = m[1];
    if (field === 'kg') {
      if (rowEmpty(tr)) {
        const btn = tr.closest('form').querySelector('button[type="submit"]');
        if (btn) btn.click();
      } else {
        addRecvRow();
        const rows = document.querySelectorAll('#recv-rows tr');
        const btn = rows[rows.length - 1].querySelector('[data-trade-btn]');
        if (btn) openTradePicker(parseInt(btn.dataset.row));   // jump straight into the picker
      }
      return;
    }
    const next = FIELDS[FIELDS.indexOf(field) + 1];
    const nextEl = tr.querySelector(`[name$="_${next}"]`);
    if (nextEl) nextEl.focus();
  });

  // Header fields (date, bilty, terminal, notes, …): Enter must NOT submit the
  // form — instead drop the cursor into the first row's Trade to start entry.
  function openFirstEmptyPicker(){
    const btns = Array.from(document.querySelectorAll('#recv-rows [data-trade-btn]'));
    const btn = btns.find(b => {
      const hid = b.parentElement.querySelector('[name$="_trade_id"]');
      return !hid || !hid.value;
    }) || btns[btns.length - 1];
    if (btn) openTradePicker(parseInt(btn.dataset.row));
  }
  const modalForm = document.querySelector('#modal-container form');
  if (modalForm) {
    modalForm.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      if (e.target.closest('#recv-rows')) return;                 // rows handled above
      if (['TEXTAREA', 'BUTTON'].includes(e.target.tagName)) return;
      e.preventDefault();
      // The checkbox is the last header control before the grid → open picker.
      if (e.target.type === 'checkbox') { openFirstEmptyPicker(); return; }
      // Otherwise advance to the next header control (date → bilty → … → checkbox).
      const list = Array.from(modalForm.querySelectorAll(
        'input:not([type=hidden]), textarea, select:not(.ss-hidden)'))
        .filter(el => !el.closest('#recv-rows') && el.type !== 'submit' && el.offsetParent !== null);
      const i = list.indexOf(e.target);
      if (i >= 0 && i < list.length - 1) list[i + 1].focus();
      else openFirstEmptyPicker();
    });
  }

  addRecvRow();
})();
</script>
