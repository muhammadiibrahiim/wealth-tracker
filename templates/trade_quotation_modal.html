<div class="modal-backdrop fixed inset-0 z-50 flex items-start justify-center overflow-y-auto py-8">
  <div class="bg-white p-7 w-full max-w-3xl mx-4">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="modal-title">New Quotation</h2>
        <p class="modal-subtitle">Proposal to a prospective customer. No journals post until accepted.</p>
      </div>
      <button type="button" class="modal-close" onclick="document.getElementById('modal-container').innerHTML = ''">✕</button>
    </div>

    {% if not vendors or not customers %}
    <div class="accent-card mb-4 wt-card-warn wt-warn-bg">
      <p class="text-sm text-yellow-900">You need at least one vendor and one customer first. <a href="/trade/parties" class="underline font-medium">Manage parties →</a></p>
    </div>
    {% endif %}

    <form hx-post="/trade/quotations" hx-target="#modal-container" hx-disabled-elt="find button[type=submit]" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="field-label field-label-required">Vendor</label>
          <select name="vendor_id" required class="w-full">
            <option value="">— Select vendor —</option>
            {% for v in vendors %}<option value="{{ v.id }}" data-terms="{{ v.default_vendor_terms_days }}">{{ v.name }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="field-label field-label-required">Purchaser (Customer)</label>
          <select name="purchaser_id" required class="w-full">
            <option value="">— Select customer —</option>
            {% for c in customers %}<option value="{{ c.id }}" data-terms="{{ c.default_customer_terms_days }}">{{ c.name }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="field-label field-label-required">Quote Date</label>
          <input type="date" name="quote_date" value="{{ today }}" required class="w-full">
        </div>
        <div>
          <label class="field-label">Valid Until</label>
          <input type="date" name="valid_until" class="w-full">
        </div>
        <div>
          <label class="field-label">Customer Terms (days)</label>
          <input type="number" min="0" name="customer_terms_days" value="30" id="customer_terms_input" required class="w-full">
        </div>
        <div>
          <label class="field-label">Vendor Terms (days)</label>
          <input type="number" min="0" name="vendor_terms_days" value="7" id="vendor_terms_input" required class="w-full">
        </div>
      </div>

      <div class="border-t border-gray-200 pt-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-base font-bold wt-ink">Line Items</h3>
          <button type="button" class="wt-info hover:text-indigo-900 text-sm font-medium" onclick="addQuoLine()">+ Add line</button>
        </div>
        <div id="quotation-lines"></div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="field-label">Notes</label>
          <textarea name="notes" rows="3" class="w-full" placeholder="Internal notes (not shown to customer)"></textarea>
        </div>
        <div>
          <label class="field-label">Terms &amp; Conditions</label>
          <textarea name="terms_text" rows="3" class="w-full" placeholder="Shown on the quotation PDF (e.g. delivery timeline, payment terms, validity)."></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
        <button type="button" class="btn-secondary" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
        <button type="submit" class="btn-primary">Create Quotation</button>
      </div>
    </form>
  </div>
</div>

<script>
  const ITEM_CATALOG = [
    {% for item in items %}
    { id: {{ item.id }}, name: {{ item.name|tojson }}, unit: {{ item.unit|tojson }},
      default_cost:"{{ item.default_cost }}", default_price:"{{ item.default_price }}",
      spec_labels: [{% for f in item.spec_fields %}{{ f.label|tojson }}{% if not loop.last %},{% endif %}{% endfor %}]
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ];

  let lineCounter = 0;
  function addQuoLine() {
    const idx = lineCounter++;
    const wrap = document.createElement('div');
    wrap.className = 'border border-gray-200 rounded-lg p-4 mb-3';
    wrap.style.background = '#fcfcfa';
    wrap.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
        <div class="md:col-span-4">
          <label class="field-label">From Catalog</label>
          <select class="item-picker w-full text-sm">
            <option value="">— Pick item —</option>
            ${ITEM_CATALOG.map(i => `<option value="${i.id}">${i.name}</option>`).join('')}
          </select>
        </div>
        <div class="md:col-span-4">
          <label class="field-label field-label-required">Item Name</label>
          <input name="line_${idx}_item_name" required class="w-full text-sm" placeholder="e.g. Flyer">
          <input type="hidden" name="line_${idx}_item_id" value="">
        </div>
        <div class="md:col-span-2">
          <label class="field-label">Qty</label>
          <input name="line_${idx}_quantity" type="number" step="0.001" min="0" value="1" class="w-full text-sm">
        </div>
        <div class="md:col-span-2">
          <label class="field-label">Unit</label>
          <input name="line_${idx}_unit" value="pcs" class="w-full text-sm">
        </div>
        <div class="md:col-span-3">
          <label class="field-label">Unit Cost ({{ currency }})</label>
          <input name="line_${idx}_unit_cost" type="number" step="0.01" min="0" value="0" class="w-full text-sm">
        </div>
        <div class="md:col-span-3">
          <label class="field-label">Unit Price ({{ currency }})</label>
          <input name="line_${idx}_unit_price" type="number" step="0.01" min="0" value="0" class="w-full text-sm">
        </div>
        <div class="md:col-span-6">
          <label class="field-label">Line Notes</label>
          <input name="line_${idx}_notes" class="w-full text-sm">
        </div>
      </div>
      <div class="mt-3">
        <div class="flex items-center justify-between mb-1">
          <span class="field-label">Specifications</span>
          <button type="button" class="wt-info text-xs font-medium" data-action="add-spec">+ add spec</button>
        </div>
        <div class="specs-container space-y-1"></div>
      </div>
      <div class="mt-3 text-right">
        <button type="button" class="wt-neg text-xs font-medium" data-action="remove-line">Remove line</button>
      </div>
    `;
    document.getElementById('quotation-lines').appendChild(wrap);

    wrap.querySelector('[data-action=remove-line]').addEventListener('click', () => wrap.remove());
    wrap.querySelector('[data-action=add-spec]').addEventListener('click', () => addSpecRow(wrap, idx));
    wrap.querySelector('.item-picker').addEventListener('change', (e) => {
      const id = parseInt(e.target.value || '0', 10);
      const item = ITEM_CATALOG.find(i => i.id === id);
      if (!item) return;
      wrap.querySelector(`[name=line_${idx}_item_name]`).value = item.name;
      wrap.querySelector(`[name=line_${idx}_item_id]`).value = item.id;
      wrap.querySelector(`[name=line_${idx}_unit]`).value = item.unit;
      wrap.querySelector(`[name=line_${idx}_unit_cost]`).value = item.default_cost;
      wrap.querySelector(`[name=line_${idx}_unit_price]`).value = item.default_price;
      const sc = wrap.querySelector('.specs-container');
      sc.innerHTML = '';
      item.spec_labels.forEach(label => addSpecRow(wrap, idx, label, ''));
    });
    addSpecRow(wrap, idx);
    if (window._enhanceSelects) window._enhanceSelects(wrap);
    return wrap;
  }
  function addSpecRow(wrap, idx, label = '', value = '') {
    const sc = wrap.querySelector('.specs-container');
    const row = document.createElement('div');
    row.className = 'flex gap-2';
    row.innerHTML = `
      <input class="w-1/3 text-sm flex-1" name="line_${idx}_spec_label" value="${label.replace(/"/g,'&quot;')}" placeholder="Label (e.g. size)">
      <input name="line_${idx}_spec_value" value="${value.replace(/"/g,'&quot;')}" placeholder="Value (e.g. 12x12)">
      <button type="button" class="wt-ash hover:wt-neg text-sm px-2">✕</button>
    `;
    row.querySelector('button').addEventListener('click', () => row.remove());
    sc.appendChild(row);
  }
  document.querySelector('select[name=vendor_id]').addEventListener('change', e => {
    const t = e.target.selectedOptions[0]?.dataset.terms;
    if (t) document.getElementById('vendor_terms_input').value = t;
  });
  document.querySelector('select[name=purchaser_id]').addEventListener('change', e => {
    const t = e.target.selectedOptions[0]?.dataset.terms;
    if (t) document.getElementById('customer_terms_input').value = t;
  });
  addQuoLine();
</script>
