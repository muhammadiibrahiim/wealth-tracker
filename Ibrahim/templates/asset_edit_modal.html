<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Edit Asset</h2>
        
        {% if error %}
        <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
            {{ error }}
        </div>
        {% endif %}
        
        <form hx-post="/wealth/assets/{{ asset.id }}/rename" hx-target="#asset-list">
            <div class="mb-4">
                <label for="new_name" class="block text-sm font-medium text-gray-700 mb-2">
                    Asset Name
                </label>
                <input 
                    type="text"
                    id="new_name"
                    name="new_name"
                    value="{{ asset.name }}"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="flex justify-end space-x-3">
                <button 
                    type="button"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50"
                    onclick="document.getElementById('modal-container').innerHTML = ''">
                    Cancel
                </button>
                <button 
                    type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Close modal on successful submission
    document.body.addEventListener('htmx:afterSwap', function(event) {
        if (event.detail.target.id === 'asset-list') {
            document.getElementById('modal-container').innerHTML = '';
        }
    });
</script>
